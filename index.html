        .sidebar { max-width: 360px; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 10px; overflow-y: auto; gap: 10px; }

        .hud-row {
            display: flex;

        .btn { border: none; padding: 5px; border-radius: 14px; cursor: pointer; font-weight: bold; color: white; font-size: 12px; transition: transform 0.12s ease, box-shadow 0.18s ease, filter 0.18s ease; }
        .btn:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 6px 14px rgba(0, 0, 0, 0.28); }
        .btn:active { transform: translateY(1px) scale(0.98); filter: brightness(0.95); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25); }
        .btn-run { background: var(--accent); width: 100%; }
        .btn-stop { background: var(--red); width: 100%; }
        .btn-pause { background: #f39c12; }
        .btn-pause.active { background: #1f6feb; }
        .btn-repeat { background: #8e44ad; }
        .btn-clear { background: #ef4444; width: 100%;padding: 10px; }
        .btn-util { background: #30363d; }
        .status { font-size: 12px; color: #8b949e; background: #11161d; border: 1px solid var(--border); padding: 7px; border-radius: 4px; word-break: break-all; }
        .main-content { flex: 1; display: grid; grid-template-columns: repeat(2, minmax(320px, 1fr)); grid-template-rows: repeat(3, minmax(180px, 1fr)); padding: 2px; gap: 2px; overflow: auto; }
        .chart-wrapper { background: var(--card); border: 1px solid var(--border); border-radius: 4px; position: relative; }
        .u-legend { font-size: 11px !important; font-weight: bold; padding: 0 !important; margin-left: 5px !important; }
        .u-legend .u-value { display: inline-block; width: 50px; text-align: left; font-family: 'Courier New', monospace; font-variant-numeric: tabular-nums; }
        .u-legend .u-label {display: inline-block; font-weight: bold;}
        .uplot{position: relative;}
        .u-title {
            font-size: 16px !important; /* גודל קטן וקריא */
            padding: 0 0 !important;   /* צמצום המרווח מעל ומתחת */
            margin: 0 !important;        /* ביטול שוליים מיותרים */
            color: #8b949e;              /* צבע אפור עדין (פחות בולט מהלבן) */
            text-align: center;
        }
        
        /* אופציונלי: הצמדת הגרף עצמו למעלה אחרי שהקטנו את הכותרת */
        .u-wrap {
            padding-top: 0 !important;
        }
    </style>
</head>
<body>

<div class="sidebar" id="SIDEBAR">
    <div class="section-title">Connection (WebSocket)</div>
    <div style="display:flex; gap:5px;">
        <select id="ports" style="flex:1;"></select>
        <button class="btn btn-util" id="scanBtn">SCAN</button>
        <button class="btn btn-util" id="connBtn">CONNECT</button>
    </div>
    <div style="display:flex; gap:5px;">
    <input type="text" id="session-name" class="hud-value" placeholder="Enter Name..." style="text-align: left; min-width: 250px;">
    <button onclick="updateName()" class="btn btn-util">🔄 New Log </button>
    </div>
    <div class="hud-row" style="padding: 10px; display: flex; align-items: center; gap: 15px;">
    <button onclick="document.getElementById('csv-file-input').click()" class="hud-btn" style="color: #79c0ff; border-color: #30363d;">
        📂 Load Local CSV
    </button>
    
    <input type="file" id="csv-file-input" accept=".csv" style="display: none;" onchange="handleFileSelect(this)">
    
    <span id="file-name-display" style="color: #8b949e; font-size: 0.9em;">No file selected</span>
    </div>

    <div class="hud-row">
    <span   class="hud-value" id="status">UNKNOWN</span>
    D: <span class="hud-value"  id="ldata">0</span>
    B: <span class="hud-value"  id="lbuf">0</span>
    </div>
    <div class="hud-row">
        P: <span class="hud-value" id="h-pos">0</span>
        E: <span class="hud-value" id="h-err">0</span>
        C: <span class="hud-value" id="h-cur">0</span>
    </div>

    <div class="section-title">Parameters</div>
    <div class="param-grid" id="param-list"></div>

    <div style="display:grid; grid-template-columns: 4fr 4fr 4fr 4fr 4fr; gap:1px;">
        <button class="btn btn-run" id="runBtn">RUN COMMAND</button>
        <button class="btn btn-stop" id="stopBtn">STOP (RESET)</button>
        <button class="btn btn-repeat" id="repeatBtn">REPEAT</button>
        <button class="btn btn-pause" id="pauseBtn">PAUSE</button>
        <button class="btn btn-util" id="imgBtn">SAVE IMAGE</button>
    </div>

    <button class="btn btn-clear" id="clearBtn">CLEAR</button>

    <div class="chart-wrapper" id="bus-graph" ></div>
</div>

<div class="main-content" id="capture-area">
    <div class="chart-wrapper" id="c-pos"></div>
    <div class="chart-wrapper" id="c-cur"></div>
    <div class="chart-wrapper" id="c-err"></div>
    <div class="chart-wrapper" id="c-pid"></div>
    <div class="chart-wrapper" id="c-vel"></div>
    <div class="chart-wrapper" id="c-pwm"></div>
</div>

<script>
    // הגדרות קבועות
    const LABELS = ["Faulhaber","KP_curr*10^3 [V/A]","KI_curr*10^3 [V/(A*cyc)]","POS [CNT]","VEL [CNT/S]","ACC [CNT/(S^2)]","I_LIM [mA]","WIN_CNT [CNT]","WIN_T [uS]","ERR_LIM [CNT]","Kp*10^3 [mA/CNT]","Ki*10^3 [mA/(CNT*S)]","Kd*10^3 [mA*S/CNT]","FDFWD*10^-3 [mA*S/CNT]","ZERO [0/1]","HOLD [0/1]"];
    const DEFS = [0,200,200,100000,1000,500,4000,1,5000,100000,40000,10000,2000,0,1,0];
    const MAXN=1000000;
    const MAXN_hd=10000000;
    let FrameRequested=false
    let isPaused = false;
    let ws = null;
    let dataLog = [];
    let isWaitingForData = false;
    let streams = makeEmptyStreams();
    let streams_hd = makeEmptyStreams_hd();
    let folder_name="default"
    const sync = uPlot.sync("my-charts");
    async function updateName(){
        let folder_name = document.getElementById('session-name').value;
        if(folder_name.length == 0){
            folder_name="default"
        }
        const response = await fetch('/name', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: folder_name })
        });
    }
    function makeEmptyStreams() {
        return { t:[], pos:[], cpos:[], cur:[], cur_f:[],cur_com: [], err:[], p:[], i:[], d:[], vel:[], bus:[], pwm:[] , curr_hd:[], curr1: [], t_hd:[]};
    }
    function makeEmptyStreams_hd() {
        return { t:[], cur:[], cur_f: [],cur_com: []};
    }

    // יצירת שדות פרמטרים
    const paramContainer = document.getElementById("param-list");
    LABELS.forEach((l, i) => {
        paramContainer.innerHTML += `<div class="param-row"><span>${l}</span><input type="number" id="p-${i}" value="${DEFS[i]}"></div>`;
    });

    // עזר ליצירת גרפים
    const chartEntries = [];
    // מודד את גודל הגרף לפי המיכל שלו (שומר על פרופורציות בעת שינוי גודל המסך)
    function measureChart(el, customDim) {
        if (customDim) {
            const w = document.getElementById("SIDEBAR").clientWidth - 22;
            return { w: Math.max(w, 50), h: customDim.h };
        }
        const rect = el.getBoundingClientRect();
        return { w: Math.max(rect.width - 4, 50), h: Math.max(rect.height - 50, 50) };
    }
    function createChart(id, title, seriesConfigs, customDim) {
        const el = document.getElementById(id);
        const { w, h } = measureChart(el, customDim);
        const opts = {
            width: w, height: h, title: title,
            scales: { x: { time: false } },
            series: [
            
            {label: "T[s]",
                value: (self, rawValue) => 
                rawValue == null ? '--' : rawValue.toFixed(2)},
            ...seriesConfigs.map(sx => ({
                ...sx,
                value: (self, rawValue) => 
                    rawValue == null ? '--' : rawValue.toFixed(2)
            }))
             ],
            axes: [
                { stroke: "#8b949e", grid: { stroke: "#21262d" } , size:30 },
                { stroke: "#8b949e", grid: { stroke: "#21262d" }  }
            ],
            padding: [10 ,10 ,0 ,10],
            cursor: { drag: { } },
            legend: { show: true },
            cursor: {
                sync: {
                    key: sync.key,
                    setSeries: true, // מסנכרן גם את ה-Legend (הדגשת הסדרה)
                    setScale: true,  // מסנכרן זום (Zoom)
                }
            }
        };
        const chart = new uPlot(opts, [[], ...seriesConfigs.map(() => [])], el);
        chartEntries.push({ chart, el, customDim });
        return chart;
    }

    let resizeRAF = null;
    function resizeAllCharts() {
        for (const e of chartEntries) {
            const { w, h } = measureChart(e.el, e.customDim);
            e.chart.setSize({ width: w, height: h });
        }
    }
    window.addEventListener("resize", () => {
        if (resizeRAF) cancelAnimationFrame(resizeRAF);
        resizeRAF = requestAnimationFrame(resizeAllCharts);
    });

    const charts = {
        pos: createChart("c-pos", "Position", [{ label: "Pos[CNT]", stroke: "#58a6ff"}, { label: "Com", stroke: "#8b949e" }]),
        cur: createChart("c-cur", "Current", [{ label: "I[mA]", stroke: "#7ee787" }, { label: "I_com", stroke: "#f85149" }]),
        err: createChart("c-err", "Error", [{ label: "Err[CNT]", stroke: "#f85149" }]),
        pid: createChart("c-pid", "PID Components", [{ label: "I_filt[mA]", stroke: "#d2a8ff"}, { label: "I_com", stroke: "#f85149" },{ label: "P", stroke: "#ff7b72" }, { label: "I", stroke: "#7ee787" }, { label: "D", stroke: "#58a6ff" }]),
        vel: createChart("c-vel", "Velocity", [{ label: "V[CNT/S]", stroke: "#e3b341" }]),
        pwm: createChart("c-pwm", "PWM", [{ label: "PWM[%]", stroke: "#ffa657" }]),
        bus: createChart("bus-graph", "Bus V", [{ label: "V[Volt]", stroke: "#8b949e"}], {w: document.getElementById("SIDEBAR").clientWidth, h: 220})
    };
    document.getElementById("status").style.color = "var(--red)";
    // חיבור WebSocket
    function connectWS() {
        if (ws) ws.close();
        let l_buf=0;
        ws = new WebSocket(`ws://${location.host}/ws`);
        
        isWaitingForData = false;
        ws.onopen = () => {
            requestNextBatch();
        };

        ws.onmessage = (e) => {
           const batch = JSON.parse(e.data);
           if (batch!=null ){
           if (Array.isArray(batch)==false) {
            document.getElementById("status").innerText = batch.message;
            if (batch.message.startsWith("con")){
                clr();updateName();portConnected=true;}
            else if (batch.message.startsWith("COM")){
            portConnected=flase;}
            }
            else if (batch.length>0) {
           document.getElementById("lbuf").innerText = batch.length;
           for (let i = 0; i < batch.length; i++) {injectToStream(batch[i])}
           document.getElementById("ldata").innerText =streams_hd.t.length;
           let toRemove=streams.t.length-MAXN;
           if (toRemove>0){Object.values(streams).forEach(s=>s.splice(0,toRemove))} 
           toRemove=streams_hd.t.length-MAXN_hd;
           if (toRemove>0){Object.values(streams_hd).forEach(s=>s.splice(0,toRemove))} 
            if (!isPaused) UpdateGraph();}         
        }
        isWaitingForData = false;
        requestAnimationFrame(requestNextBatch);};

        ws.onclose = () => {
            document.getElementById("status").innerText = "WS Disconnected";
            document.getElementById("status").style.color = "var(--red)";
        };
    }
    function requestNextBatch() {
        if (ws.readyState === WebSocket.OPEN && !isWaitingForData) {
            isWaitingForData = true;
            ws.send("/pull"); // האות לסרבר לשלוח את מה שצבר
        }}
    function UpdateGraph() {
        charts.pos.setData([streams.t, streams.pos, streams.cpos]);
        charts.cur.setData([streams_hd.t, streams_hd.cur,streams_hd.cur_com]);
        charts.err.setData([streams.t, streams.err]);
        charts.pid.setData([streams.t,streams.cur_f,streams.cur_com, streams.p, streams.i, streams.d]);
        charts.vel.setData([streams.t, streams.vel]);
        charts.pwm.setData([streams.t, streams.pwm]);
        charts.bus.setData([streams.t, streams.bus]);
        if (streams.pos.length === 0 || streams.err.length === 0 || streams.cur.length === 0) {
            return;
        }
        document.getElementById("h-pos").innerText = streams.pos[streams.pos.length-1].toFixed(0);
        document.getElementById("h-err").innerText = streams.err[streams.err.length-1].toFixed(0);
        document.getElementById("h-cur").innerText = streams.cur[streams.cur.length-1].toFixed(0);
        FrameRequested=false
    }

    // פקודות API
    async function sendCommand(header) {
        const cmd = new Int32Array(18);
        cmd[0] = header;
        if (header === 200) {
            for (let i = 1; i <= 13; i++) cmd[i] = parseInt(document.getElementById(`p-${i}`).value) || 0;
            const faul = parseInt(document.getElementById("p-0").value) || 0;
            const zero = parseInt(document.getElementById("p-14").value) || 0;
            const hold = parseInt(document.getElementById("p-15").value) || 0;
            cmd[14] = faul + (2 * zero) + (4 * hold);
            cmd[15] = 54;
            let sum = 0;
            for (let i = 0; i <= 15; i++) {
                let v = Math.abs(cmd[i]);
                sum += (v % 65536) + Math.floor(v / 65536);
            }
            cmd[16] = sum;
            cmd[17] = 201;
        }

        await fetch('/send-cmd', {
            method: 'POST',
            body: JSON.stringify({ cmdArray: Array.from(cmd) })
        });
    }

    // ניהול כפתורים
    document.getElementById("runBtn").onclick = () => sendCommand(200);
    document.getElementById("repeatBtn").onclick = () => sendCommand(200);
    document.getElementById("stopBtn").onclick = () => sendCommand(255);
    
    document.getElementById("pauseBtn").onclick = (e) => {
        isPaused = !isPaused;
        e.target.innerText = isPaused ? "RESUME" : "PAUSE";
        e.target.classList.toggle("active", isPaused);
    };

    document.getElementById("clearBtn").onclick = () => {saveScreenshot() ;clr()};

    function clr() {
        dataLog = [];
        streams = makeEmptyStreams();streams_hd = makeEmptyStreams_hd();
        charts.pos.setData([[], [], []]);
        charts.cur.setData([[], [], []]);
        charts.err.setData([[], []]);
        charts.pid.setData([[], [], [], [], [], []]);
        charts.vel.setData([[], []]);
        charts.pwm.setData([[], []]);
        charts.bus.setData([[], []]);
    }

    document.getElementById("imgBtn").onclick = () => {saveScreenshot() 
        /*
        html2canvas(document.body).then(canvas => {
            const a = document.createElement("a");
            a.href = canvas.toDataURL();
            a.download = "v2_capture.png";
            a.click();
        });*/
    };
    async function saveScreenshot() {
    // אנחנו מצלמים את ה-body או דיב ספציפי כמו id="hud-container"
    const element = document.body; 

    try {
        // html2canvas מחזיר Canvas שמכיל צילום של כל ה-DOM
        const capturedCanvas = await html2canvas(element, {
            backgroundColor: "#0d1117", // הגדרת רקע כדי שלא יהיה שקוף
            logging: false,
            useCORS: true,
            scale: 2
        });

        const imageData = capturedCanvas.toDataURL("image/png");

        // שליחה לשרת ה-Go (בדיוק כפי שעשינו קודם)
        const response = await fetch('/save-image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: imageData })
        });
        
        if (response.ok) {
            console.log("Full HUD screenshot saved!");
        }
    } catch (err) {
        console.error("Full screenshot failed:", err);
    }
    }
      document.getElementById("scanBtn").onclick = async () => {
        const res = await fetch('/ports');
        const data = await res.json();
        const sel = document.getElementById("ports");
        sel.innerHTML = ''; // Clear existing options
        data.forEach(data => {
            const opt = document.createElement('option');
            opt.value = data;       // מה שיישלח לשרת (למשל "com1")
            opt.textContent = data; // מה שהמשתמש יראה במסך
            sel.appendChild(opt);
        });
    };

    document.getElementById("connBtn").onclick = connectPort;

    async function connectPort() {
        const selectedPort = document.getElementById('ports').value;
        
        const response = await fetch('/open-port', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ port: selectedPort })
        });
    }
    // אתחול
    window.onload = () => {
        document.getElementById("scanBtn").click();
        connectWS();
    };

class Frame{Time=0;Values=new Array(23).fill(0)}

async function handleFileSelect(input) {
    const response = await fetch('/open-port', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ port: "NOCOM" })
    });
    clr();
    const file = input.files[0];
    if (!file) return;

    const reader = new FileReader();
    console.log("Starting CSV parse: " + file.name);
    Papa.parse(file, {
        worker: true,     // הרצה בתהליך נפרד כדי לא לתקוע את ה-UI
        header: true,     // הקובץ שלך כולל כותרות (LABELS)
        dynamicTyping: true, // המרה אוטומטית למספרים
        skipEmptyLines: true,
        step: function(results) {
            // פונקציה זו רצה עבור כל שורה בנפרד (מונעת עומס זיכרון)
            const row = results.data;
            
            // חילוץ הזמן (העמודה הראשונה ב-CSV שלך היא TIME[S])
            data=new Frame;
            data.Time = parseFloat(row["TIME[S]"]);
            if(data.Time<streams.t.at(-1)){clr();}
            data.Values = Object.values(row).slice(1).map(v => parseFloat(v));
            injectToStream(data);},
        complete: function() {
            console.log("CSV Load Complete");
            // עדכון סופי של הגרפים
            UpdateGraph();isWaitingForData = false;
            document.getElementById("status").innerText = "CSV LOADED";
            document.getElementById("status").style.color = "var(--accent)";
            }    
        });
}

function injectToStream(data) {
    const val = data.Values;
    let delt=-0.00027;
    streams.t.push(data.Time);
    streams.pos.push(val[0]);
    streams.cpos.push(val[0]+val[1]);
    streams.cur.push(val[2]);
    streams.cur_f.push(val[3]);
    streams.cur_com.push(val[4]);
    streams.err.push(val[1]);
    streams.p.push(val[5]);
    streams.i.push(val[6]);
    streams.d.push(val[7]);
    streams.vel.push(val[11]);
    streams.bus.push(val[9]);
    streams.pwm.push(val[8]/100);
    for (let j=0;j<10;j++){streams_hd.cur.push(val[13+j]);
        streams_hd.cur_com.push(streams.cur_com[streams.cur_com.length-1]);streams_hd.t.push(data.Time+delt);delt+=0.00003;}
}

</script>
</body>
</html>
